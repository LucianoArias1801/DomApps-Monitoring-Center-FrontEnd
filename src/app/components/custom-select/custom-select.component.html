<div
  class="form-group custom-dropdown-wrapper"
  [class.disabled-wrapper]="disabled"
>
  <label class="input-label">{{ label }}</label>

  <ion-item
    button
    lines="none"
    class="domapps-input-item"
    [disabled]="disabled"
    (click)="toggleDropdown()"
  >
    <ion-label [class.placeholder-text]="!displayValue">
      {{ displayValue || placeholder }}
    </ion-label>
    <ion-icon
      name="chevron-down-outline"
      slot="end"
      color="medium"
      [class.icon-rotated]="isOpen"
    ></ion-icon>
  </ion-item>

  <div class="dropdown-menu-box" *ngIf="isOpen">
    <div class="search-header" *ngIf="searchable">
      <ion-searchbar
        [placeholder]="placeholder"
        [value]="searchQuery"
        (ionInput)="onSearchInput($event)"
        class="domapps-searchbar"
        mode="md"
      ></ion-searchbar>
    </div>

    <div class="dropdown-list-scroll">
      <ion-list lines="none">
        <ion-item *ngIf="loading">
          <ion-spinner name="dots"></ion-spinner>
          <ion-label style="margin-left: 10px">Buscando...</ion-label>
        </ion-item>

        <ion-item
          button
          *ngFor="let option of options"
          (click)="selectItem(option)"
        >
          <ion-label>{{ option.text }}</ion-label>
          <ion-note
            *ngIf="option.subtitle"
            slot="end"
            color="medium"
            style="
              font-size: 11px;
              border: 1px solid #e2e8f0;
              padding: 2px 6px;
              border-radius: 4px;
            "
          >
            {{ option.subtitle }}
          </ion-note>
        </ion-item>

        <ion-item *ngIf="options.length === 0 && !loading">
          <ion-label color="medium" class="ion-text-center"
            >No hay opciones disponibles</ion-label
          >
        </ion-item>
      </ion-list>
    </div>
  </div>

  <div
    class="invisible-backdrop"
    *ngIf="isOpen"
    (click)="closeDropdown()"
  ></div>
</div>
