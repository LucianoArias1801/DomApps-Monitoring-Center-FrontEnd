<ion-content class="login-content">
  <div class="login-wrapper fade-in">
    <div class="login-card">
      <header class="login-header">
        <div class="branding-container">
          <img
            src="assets/images/domapps-logo.png"
            alt="Domapps Logo"
            class="nav-logo"
          />
          <h1 class="brand-title">Domapps <b>Monitoring Center</b></h1>
        </div>

        <div class="welcome-container">
          <h2 class="login-title">Bienvenido</h2>
          <p class="login-subtitle">Por favor ingresa tus datos</p>
        </div>
      </header>

      <form [formGroup]="loginForm" class="login-form">
        <div class="input-group">
          <label class="field-label">Correo electrónico</label>
          <ion-item lines="none" class="custom-input-item">
            <ion-input
              formControlName="email"
              type="email"
              placeholder="user@domapps.com"
            >
            </ion-input>
          </ion-item>

          <ion-text
            color="danger"
            *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          >
            Correo electrónico inválido
          </ion-text>
        </div>

        <div class="input-group">
          <label class="field-label">Contraseña</label>
          <ion-item lines="none" class="custom-input-item">
            <ion-input
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="••••••••"
            >
            </ion-input>
            <ion-button slot="end" fill="clear" (click)="togglePassword()">
              <ion-icon
                [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
              ></ion-icon>
            </ion-button>
          </ion-item>
          <ion-text
            color="danger"
            *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          >
            La contraseña es requerida
          </ion-text>
        </div>

        <ion-button
          expand="block"
          type="button"
          (click)="onLogin()"
          class="login-btn"
          [disabled]="loginForm.invalid || isLoading"
        >
          <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
          <span *ngIf="!isLoading">Iniciar sesión</span>
        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
