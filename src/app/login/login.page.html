<ion-content class="login-content">
  <div class="login-wrapper fade-in">
    <div class="login-card">
      <header class="login-header">
        <div class="branding-container">
          <img
            src="assets/images/domapps-logo.png"
            alt="Domapps Logo"
            class="nav-logo"
          />
          <h1 class="brand-title">Domapps <b>Monitoring Center</b></h1>
        </div>

        <div class="welcome-container">
          <h2 class="login-title">Bienvenido</h2>
          <p class="login-subtitle">Por favor ingresa tus datos</p>
        </div>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
        <div class="input-group">
          <label class="field-label">Correo electrónico</label>
          <ion-item lines="none" class="custom-input-item">
            <ion-input
              formControlName="email"
              type="email"
              placeholder="user@domapps.com"
            >
            </ion-input>
          </ion-item>
        </div>

        <div class="input-group">
          <label class="field-label">Contraseña</label>
          <ion-item lines="none" class="custom-input-item">
            <ion-input
              formControlName="password"
              type="password"
              placeholder="••••••••"
            >
            </ion-input>
          </ion-item>
        </div>

        <ion-button
          expand="block"
          type="submit"
          class="login-btn"
          [disabled]="loginForm.invalid"
        >
          Iniciar sesión
        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
