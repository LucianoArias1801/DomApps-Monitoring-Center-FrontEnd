<app-header></app-header>

<ion-content class="main-content">
  <div class="page-header">
    <h2 class="centered-title" style="text-align: left; margin: 0">
      Tableros de Inteligencia
    </h2>
    <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px">
      Seleccione un tablero para visualizar métricas o gestionar sus datos.
    </p>
  </div>

  <ion-grid class="dashboards-grid">
    <ion-row>
      <ion-col
        size="12"
        size-md="6"
        size-lg="4"
        size-xl="3"
        *ngFor="let item of dashboards"
      >
        <ion-card class="hub-card">
          <div class="card-image-wrapper">
            <img
              [src]="item.img_url"
              alt="Miniatura del Tablero"
              class="card-img"
            />
          </div>

          <div class="card-footer">
            <div class="title-container">
              <h3 class="board-title truncate-text">{{ item.title }}</h3>
            </div>

            <ion-button
              fill="clear"
              class="menu-btn"
              [id]="'popover-trigger-' + item.id"
            >
              <ion-icon name="ellipsis-vertical"></ion-icon>
            </ion-button>
          </div>
        </ion-card>

        <ion-popover
          [trigger]="'popover-trigger-' + item.id"
          triggerAction="click"
          dismiss-on-select="true"
          class="domapps-popover"
          #popover
        >
          <ng-template>
            <ion-content>
              <ion-list lines="none" class="user-menu-list">
                <ion-item button (click)="openDashboard(item.powerBiUrl)">
                  <ion-icon
                    name="open-outline"
                    slot="start"
                    style="color: var(--app-primary)"
                  ></ion-icon>
                  <ion-label>Ver Tablero</ion-label>
                </ion-item>

                <div class="menu-divider"></div>

                <ion-item
                  button
                  *ngIf="item.allowDownload"
                  (click)="openDownloadFilters(item)"
                >
                  <ion-icon
                    name="download-outline"
                    slot="start"
                    color="medium"
                  ></ion-icon>
                  <ion-label>Descargar Datos</ion-label>
                </ion-item>

                <ion-item
                  button
                  *ngIf="item.allowUpload && !isVisualizador"
                  (click)="openUploadModal(item)"
                >
                  <ion-icon
                    name="cloud-upload-outline"
                    slot="start"
                    class="upload-icon"
                  ></ion-icon>
                  <ion-label>Subir Datos</ion-label>
                </ion-item>
              </ion-list>
            </ion-content>
          </ng-template>
        </ion-popover>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
